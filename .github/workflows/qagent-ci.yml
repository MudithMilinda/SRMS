name: QAgent PR Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-checks:
    name: QAgent code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript and TypeScript syntax
        shell: bash
        run: |
          find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path '*/node_modules/*' -not -path '*/.git/*' -print0 | xargs -0 -r -n 1 node --check
          python -m compileall -q . -x '(/node_modules/|/.git/|/.venv/|/venv/)'
      - name: Frontend lint and type checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            folder="$(dirname "$manifest")"
            cd "$GITHUB_WORKSPACE/$folder"
            if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then npm run lint; fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then npm run typecheck; fi
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print0)
